name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        run: |
          npm install -g pnpm@10.24.0
          pnpm --version

      - name: Build assets
        env:
          VITE_ENABLE_PWA: "true"
          VITE_APP_ENV: "production"
          VITE_SW_VERSION: ${{ github.sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          echo "Built assets:"
          ls -la public/build || true
          find public/build -maxdepth 2 -type f | sort | head -100 || true
          test -f public/build/manifest.json

      - name: Preflight SSH connectivity
        run: |
          set -euo pipefail
          echo "Checking SSH target reachability..."
          if command -v getent >/dev/null 2>&1; then
            getent hosts "${{ secrets.SSH_HOST }}" || true
          fi
          nc -vz -w 10 "${{ secrets.SSH_HOST }}" "${{ secrets.SSH_PORT }}"

      - name: Upload build to temp folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
          source: "public/build"
          target: "/home/u633781435/domains/losquincedevale.site/public_html/build-new/"
          strip_components: 1

      - name: Atomic swap build folders
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            cd /home/u633781435/domains/losquincedevale.site/public_html
            rm -rf build-old
            if [ -d build ]; then mv build build-old; fi
            mv build-new build
            rm -rf build-old
            echo "Build swap atómico completado"

  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Preflight SSH connectivity
        run: |
          set -euo pipefail
          echo "Checking SSH target reachability..."
          if command -v getent >/dev/null 2>&1; then
            getent hosts "${{ secrets.SSH_HOST }}" || true
          fi
          nc -vz -w 10 "${{ secrets.SSH_HOST }}" "${{ secrets.SSH_PORT }}"

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            APP_DIR=/home/u633781435/domains/losquincedevale.site/Miquinceanera
            WEBROOT=/home/u633781435/domains/losquincedevale.site/public_html

            cd "$APP_DIR"
            git pull origin main
            rm -f public/hot "$WEBROOT/hot"
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative --ignore-platform-req=ext-gd
            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            mkdir -p "$WEBROOT"
            mkdir -p "$WEBROOT/build"
            rm -rf "$WEBROOT/build"/*
            cp -a "$APP_DIR/public/build/." "$WEBROOT/build/"

            rm -rf "$WEBROOT/storage"
            ln -sfn "$APP_DIR/storage/app/public" "$WEBROOT/storage"

            printf '%s\n' \
              '<IfModule mod_rewrite.c>' \
              '    RewriteEngine On' \
              '    RewriteCond %{REQUEST_FILENAME} !-f' \
              '    RewriteCond %{REQUEST_FILENAME} !-d' \
              '    RewriteRule ^ index.php [L]' \
              '</IfModule>' > "$WEBROOT/.htaccess"

            if [[ ! -s "$WEBROOT/index.php" ]]; then
              printf '%s\n' \
                '<?php' \
                '' \
                'use Illuminate\\Foundation\\Application;' \
                'use Illuminate\\Http\\Request;' \
                '' \
                "define('LARAVEL_START', microtime(true));" \
                '' \
                "if (file_exists(\$maintenance = __DIR__.'/../Miquinceanera/storage/framework/maintenance.php')) {" \
                '    require $maintenance;' \
                '}' \
                '' \
                "require __DIR__.'/../Miquinceanera/vendor/autoload.php';" \
                '' \
                '/** @var Application $app */' \
                "\$app = require_once __DIR__.'/../Miquinceanera/bootstrap/app.php';" \
                '' \
                '$app->handleRequest(Request::capture());' > "$WEBROOT/index.php"
            fi

            echo "Deploy backend + sync frontend completado"